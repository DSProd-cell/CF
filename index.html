<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shortlist Generator v2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: '#EA580C',
            'accent-dark': '#C2410C',
            surface: '#F1F5F9',
            card: '#FFFFFF',
            'text-main': '#0F172A',
            'text-muted': '#64748B',
            border: '#E2E8F0',
          },
          fontFamily: { body: ['Poppins', 'sans-serif'], mono: ['Fira Code', 'monospace'] },
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="font-body bg-surface text-text-main min-h-screen pb-20">

  <!-- 1. Header of user details -->
  <div class="bg-white border-b border-border sticky top-0 z-20">
    <div class="max-w-[1400px] mx-auto px-5 py-3 flex items-center justify-between gap-3 flex-wrap lg:flex-nowrap">
      <div class="flex items-center gap-3 min-w-0 shrink-0">
        <div class="w-9 h-9 rounded-lg bg-accent flex items-center justify-center shrink-0">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
        <div>
          <h1 class="text-sm font-semibold leading-tight">Shortlist Generator</h1>
          <p class="text-xs text-text-muted leading-tight">v2 — prototype</p>
        </div>
      </div>

      <div id="studentMeta" class="flex items-center gap-3 min-w-0 w-full order-3 lg:order-none lg:w-auto lg:flex-1 justify-center"></div>

      <div class="flex items-center gap-2 shrink-0">
        <select id="studentSwitcher" class="text-sm border border-border rounded-lg px-3 py-2 bg-white cursor-pointer">
          <option value="priya">Priya Sharma</option>
          <option value="arjun">Arjun Mehta</option>
          <option value="sana">Sana Iyer</option>
          <option value="karan">Karan Verma (blank)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Full-width sections: Always required, Flexible fields, Course in Mind, Shortlist based on -->
  <div class="max-w-[1400px] mx-auto px-5 pt-4 space-y-4">

    <!-- 2. Always required (incl. Budget) -->
    <div class="bg-white border border-border rounded-xl p-4">
      <div class="text-sm font-semibold mb-3">Always required <span class="text-xs font-normal text-text-muted">— editable, but always constrains the search</span></div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="alwaysRequired"></div>
    </div>

    <!-- 3. Flexible fields (collapsed by default) -->
    <div class="bg-white border border-border rounded-xl p-4">
      <div class="w-full flex items-center justify-between gap-2 flex-wrap">
        <button id="flexPanelHeader" type="button" class="flex items-center gap-2 cursor-pointer">
          <svg id="flexPanelChevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4 text-text-muted transition-transform"><path stroke-linecap="round" stroke-linejoin="round" d="M9 18l6-6-6-6"/></svg>
          <span class="text-sm font-semibold">Flexible fields</span>
          <span id="flexPanelSummary" class="text-xs text-text-muted"></span>
        </button>
        <span class="flex items-center gap-2.5 text-sm">
          <span class="text-text-muted">With constraint</span>
          <label class="switch">
            <input type="checkbox" id="flexSwitch" />
            <span class="track"></span>
          </label>
          <span class="text-text-muted">Student to join F2F</span>
        </span>
      </div>
      <div id="flexPanelBody" class="hidden mt-3">
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
          <div class="flex-field">
            <label class="text-xs font-medium text-text-muted block mb-1">Intake</label>
            <select id="intakeFlex" class="w-full text-sm border border-border rounded-lg px-2.5 py-2 bg-white cursor-pointer">
              <option value="Sep 2026">Sep 2026</option>
              <option value="Jan 2027">Jan 2027</option>
              <option value="May 2027">May 2027</option>
            </select>
          </div>
          <div class="flex-field">
            <label class="text-xs font-medium text-text-muted block mb-1">Backlog(s) allowed</label>
            <input id="backlogs" type="number" step="1" min="0" class="w-full text-sm border border-border rounded-lg px-2.5 py-2 font-mono" />
          </div>
          <div class="flex-field">
            <label class="text-xs font-medium text-text-muted block mb-1">Work exp (months)</label>
            <input id="workExp" type="number" step="1" min="0" class="w-full text-sm border border-border rounded-lg px-2.5 py-2 font-mono" />
          </div>
          <div class="flex-field">
            <label class="text-xs font-medium text-text-muted block mb-1">Grades (min %)</label>
            <input id="grade" type="number" step="1" min="0" max="100" class="w-full text-sm border border-border rounded-lg px-2.5 py-2 font-mono" />
          </div>
          <div class="flex-field">
            <label class="text-xs font-medium text-text-muted block mb-1">Course category</label>
            <select id="categoryFlex" class="w-full text-sm border border-border rounded-lg px-2.5 py-2 bg-white cursor-pointer">
              <option value="all">All categories</option>
              <option value="stem">STEM</option>
              <option value="business">Business</option>
            </select>
          </div>
        </div>
        <div class="flex items-center justify-between gap-3 mt-3 flex-wrap">
          <p id="flexNote" class="text-xs text-text-muted flex-1 min-w-[200px]"></p>
          <button id="applyFlexBtn" type="button" class="shrink-0 bg-accent hover:bg-accent-dark text-white text-xs font-semibold px-4 py-2 rounded-lg cursor-pointer transition-colors">Apply</button>
        </div>
      </div>
    </div>

    <!-- 4. Course in Mind (collapsed list of up to 5) -->
    <div class="bg-white border border-border rounded-xl" id="cimRow"></div>

    <!-- 5. Shortlist based on — full width, pills + search in one row -->
    <div class="bg-white border border-border rounded-xl p-4 space-y-3">
      <div class="flex items-center justify-between flex-wrap gap-3">
        <div class="text-sm font-semibold">Shortlist based on</div>
        <div id="sourceSelector" class="inline-flex bg-surface rounded-lg p-1 gap-1"></div>
      </div>
      <p id="sourceCaption" class="text-xs text-text-muted -mt-2"></p>

      <div class="flex items-end gap-3 flex-wrap pt-1">
        <div id="courseTypePills" class="flex-1 min-w-[240px]"></div>
        <div class="flex items-center gap-2 shrink-0">
          <input id="courseSearch" type="text" placeholder="Search college or course…" class="w-56 text-sm border border-border rounded-lg px-3 py-2" />
          <button id="applySearchBtn" type="button" class="shrink-0 bg-accent hover:bg-accent-dark text-white text-xs font-semibold px-4 py-2 rounded-lg cursor-pointer transition-colors">Apply</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Sidebar + main: starts below "Shortlist based on" -->
  <div class="max-w-[1400px] mx-auto px-5 py-4 flex gap-5 items-start">

    <!-- Sidebar: Global Search + FILTERS accordion -->
    <aside class="w-[240px] shrink-0 bg-white border border-border rounded-xl p-4 hidden lg:block">
      <div class="mb-4">
        <div class="text-xs font-bold text-text-muted uppercase tracking-wide mb-2">Global Search</div>
        <input id="globalSearch" type="text" placeholder="Type anything to Search" class="w-full text-sm border border-border rounded-lg px-2.5 py-2" />
      </div>
      <div class="text-xs font-bold text-text-muted uppercase tracking-wide mb-1 pt-1 border-t border-border">Filters</div>
      <div id="filterAccordion"></div>
    </aside>

    <!-- Main -->
    <main class="flex-1 min-w-0 space-y-4">

      <!-- Cohort tabs -->
      <div class="bg-white border border-border rounded-xl px-4 pt-3 pb-2">
        <div id="cohortTabs" class="flex items-center gap-5 overflow-x-auto"></div>
        <div id="relaxedToggleWrap" class="hidden mt-2 pt-2 border-t border-border"></div>
      </div>

      <!-- Results grid -->
      <div id="resultsGrid" class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-2.5"></div>

    </main>
  </div>

  <!-- Persistent bottom bookmarks bar -->
  <div id="bottomBar" class="fixed bottom-0 left-0 right-0 bg-accent text-white z-30 shadow-[0_-4px_16px_rgba(0,0,0,0.15)]">
    <div class="max-w-[1400px] mx-auto px-5 py-3 flex items-center justify-between gap-3">
      <span id="bottomBarCount" class="text-sm font-semibold">0 Courses added</span>
      <button id="viewBookmarksBtn" type="button" class="flex items-center gap-2 bg-white text-accent-dark text-sm font-semibold px-4 py-2 rounded-lg cursor-pointer transition-colors">
        View Bookmarks
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
      </button>
    </div>
  </div>

  <!-- Drawer -->
  <div id="drawer">
    <div id="drawerBackdrop"></div>
    <div id="drawerPanel">
      <div class="flex items-center justify-between px-5 py-4 border-b border-border">
        <div class="font-semibold text-sm">Shortlist</div>
        <button id="drawerCloseBtn" class="text-text-muted hover:text-text-main cursor-pointer p-1" type="button">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="drawerList" class="flex-1 overflow-y-auto"></div>
      <div class="p-4 border-t border-border">
        <button id="sendShortlistBtn" type="button" class="w-full bg-accent hover:bg-accent-dark text-white text-sm font-medium py-2.5 rounded-lg cursor-pointer transition-colors">Send to student</button>
      </div>
    </div>
  </div>

  <div id="toast">
    <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
    Shortlist sent to student (demo).
  </div>

  <script src="app.js"></script>
</body>
</html>
